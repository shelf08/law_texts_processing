<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Граф онтологии — ПравоНавт</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg-primary:    #0d1117;
            --bg-secondary:  #161b22;
            --bg-tertiary:   #21262d;
            --border-color:  #30363d;
            --text-primary:  #c9d1d9;
            --text-secondary:#8b949e;
            --text-muted:    #6e7681;
            --accent:        #58a6ff;
            --accent-hover:  #79c0ff;
            --success:       #3fb950;
            --error:         #f85149;
            --warning:       #d29922;
            --node-law:      #58a6ff;
            --node-article:  #3fb950;
            --node-term:     #d29922;
            --nav-h:         52px;
        }

        body {
            font-family: 'IBM Plex Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex; flex-direction: column;
            font-size: 14px; overflow: hidden;
        }

        /* ── NAV ─────────────────────────────────────────────────────────── */
        .topnav {
            flex-shrink: 0;
            height: var(--nav-h);
            background: rgba(13,17,23,0.92);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(48,54,61,0.9);
            display: flex; align-items: center;
            padding: 0 20px; gap: 0; z-index: 100;
        }
        .brand {
            display: flex; align-items: center; gap: 8px;
            text-decoration: none; color: var(--text-primary);
            font-family: 'Outfit', sans-serif;
            font-size: 15px; font-weight: 700; letter-spacing: -.02em;
        }
        .brand-icon { color: var(--accent); flex-shrink: 0; }
        .nav-sep { width: 1px; height: 16px; background: var(--border-color); margin: 0 14px; }
        .nav-title {
            font-family: 'Outfit', sans-serif;
            font-size: 14px; font-weight: 600; color: var(--text-secondary);
        }
        .nav-right { margin-left: auto; display: flex; align-items: center; gap: 12px; }
        .stats-chips { display: flex; gap: 6px; }
        .stat-chip {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 9px;
            background: var(--bg-tertiary); border: 1px solid var(--border-color);
            border-radius: 6px; font-size: 11px; color: var(--text-muted);
        }
        .stat-chip-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .stat-chip-val { color: var(--text-secondary); font-weight: 500; }

        .nav-link {
            padding: 5px 11px; border-radius: 6px;
            color: var(--text-secondary); text-decoration: none;
            font-size: 13px; font-weight: 500;
            transition: color .15s, background .15s;
            display: flex; align-items: center; gap: 5px;
        }
        .nav-link:hover { color: var(--text-primary); background: var(--bg-tertiary); }

        /* ── MAIN ────────────────────────────────────────────────────────── */
        .main-area {
            flex: 1; display: flex; overflow: hidden; position: relative;
        }

        /* ── CANVAS ──────────────────────────────────────────────────────── */
        #graph-svg {
            flex: 1;
            /* dot grid */
            background-color: var(--bg-primary);
            background-image: radial-gradient(circle, #30363d 1px, transparent 1px);
            background-size: 28px 28px;
            cursor: grab;
        }
        #graph-svg:active { cursor: grabbing; }

        /* ── SIDEBAR ─────────────────────────────────────────────────────── */
        .sidebar {
            width: 268px; flex-shrink: 0;
            background: rgba(22,27,34,0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-left: 1px solid var(--border-color);
            display: flex; flex-direction: column;
            overflow: hidden;
        }
        .sb-section {
            padding: 12px 14px;
            border-bottom: 1px solid rgba(48,54,61,.7);
        }
        .sb-title {
            font-size: 10px; font-weight: 700;
            text-transform: uppercase; letter-spacing: .08em;
            color: var(--text-muted); margin-bottom: 9px;
        }

        /* ── LEGEND ──────────────────────────────────────────────────────── */
        .legend-items { display: flex; flex-direction: column; gap: 4px; }
        .legend-item {
            display: flex; align-items: center; gap: 8px;
            padding: 5px 8px; border-radius: 7px;
            cursor: pointer; user-select: none;
            transition: background .12s;
            border: 1px solid transparent;
        }
        .legend-item:hover { background: rgba(255,255,255,.04); }
        .legend-item.hidden { opacity: .4; }
        .legend-dot {
            width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0;
        }
        .legend-label { font-size: 12px; color: var(--text-secondary); flex: 1; }
        .legend-item:not(.hidden) .legend-label { color: var(--text-primary); }

        /* ── EDGE LEGEND ─────────────────────────────────────────────────── */
        .edge-items { display: flex; flex-direction: column; gap: 5px; }
        .edge-item { display: flex; align-items: center; gap: 8px; }
        .edge-line-preview {
            width: 24px; height: 0; flex-shrink: 0;
        }
        .edge-label { font-size: 11px; color: var(--text-muted); }

        /* ── FILTER ──────────────────────────────────────────────────────── */
        .filter-select {
            width: 100%;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            color: var(--text-primary);
            border-radius: 6px; padding: 6px 9px;
            font-size: 12px; outline: none;
            font-family: inherit;
        }
        .filter-select:focus { border-color: var(--accent); }

        /* ── NODE DETAIL ─────────────────────────────────────────────────── */
        .node-detail {
            flex: 1; overflow-y: auto; padding: 14px;
        }
        .node-detail.empty {
            display: flex; align-items: center; justify-content: center;
            text-align: center;
        }
        .node-detail.empty p {
            font-size: 12px; color: var(--text-muted); line-height: 1.6;
        }

        .detail-badge {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 3px 10px; border-radius: 6px;
            font-size: 11px; font-weight: 600; margin-bottom: 10px;
        }
        .detail-badge-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
        .badge-law     { background: rgba(88,166,255,.1);  border: 1px solid rgba(88,166,255,.3);  color: var(--node-law); }
        .badge-article { background: rgba(63,185,80,.1);   border: 1px solid rgba(63,185,80,.3);   color: var(--node-article); }
        .badge-term    { background: rgba(210,153,34,.1);  border: 1px solid rgba(210,153,34,.3);  color: var(--node-term); }

        .detail-label {
            font-size: 13px; font-weight: 600; color: var(--text-primary);
            margin-bottom: 12px; word-break: break-word; line-height: 1.4;
        }
        .detail-row {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 12px; padding: 5px 0;
            border-bottom: 1px solid rgba(48,54,61,.5);
            color: var(--text-muted);
        }
        .detail-row:last-of-type { border-bottom: none; }
        .detail-row span:last-child {
            color: var(--text-primary); font-weight: 600;
            font-variant-numeric: tabular-nums;
        }
        .detail-link {
            display: inline-flex; align-items: center; gap: 4px;
            margin-top: 12px; color: var(--accent); font-size: 12px; text-decoration: none;
        }
        .detail-link:hover { color: var(--accent-hover); text-decoration: underline; }

        /* ── ZOOM CONTROLS ───────────────────────────────────────────────── */
        .controls {
            position: absolute; bottom: 20px; left: 16px;
            display: flex; flex-direction: column; gap: 5px;
        }
        .ctrl-btn {
            width: 34px; height: 34px;
            background: rgba(22,27,34,0.9);
            backdrop-filter: blur(8px);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            border-radius: 8px; cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: color .15s, border-color .15s, background .15s;
        }
        .ctrl-btn:hover { color: var(--accent); border-color: rgba(88,166,255,.4); background: rgba(22,27,34,1); }

        /* ── TOOLTIP ─────────────────────────────────────────────────────── */
        #tooltip {
            position: fixed;
            background: rgba(22,27,34,0.95);
            border: 1px solid var(--border-color);
            border-radius: 8px; padding: 7px 11px;
            font-size: 12px; color: var(--text-primary);
            pointer-events: none; z-index: 300; display: none;
            max-width: 220px;
            box-shadow: 0 4px 20px rgba(0,0,0,.6);
        }
        #tooltip strong { display: block; margin-bottom: 2px; }
        #tooltip span { color: var(--text-muted); font-size: 11px; }

        /* ── LOADING / ERROR ─────────────────────────────────────────────── */
        #loading {
            position: absolute; inset: 0;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            background: var(--bg-primary); z-index: 50; gap: 14px;
        }
        .spinner {
            width: 36px; height: 36px;
            border: 2.5px solid var(--border-color);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin .75s linear infinite;
        }
        .loading-text { font-size: 13px; color: var(--text-muted); }
        @keyframes spin { to { transform: rotate(360deg); } }

        #error-msg {
            display: none; position: absolute; inset: 0;
            align-items: center; justify-content: center;
            color: var(--error); font-size: 14px;
            background: var(--bg-primary);
        }

        /* ── D3 NODES (CSS filter for glow) ─────────────────────────────── */
        .node circle { filter: url(#node-glow); }
        .node text { font-family: 'IBM Plex Sans', sans-serif; }
    </style>
</head>
<body>

<!-- Glow filter — applied via CSS to .node circle -->
<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
    <defs>
        <filter id="node-glow" x="-60%" y="-60%" width="220%" height="220%">
            <feGaussianBlur stdDeviation="3.5" result="glow"/>
            <feMerge>
                <feMergeNode in="glow"/>
                <feMergeNode in="SourceGraphic"/>
            </feMerge>
        </filter>
    </defs>
</svg>

<!-- ── NAV ──────────────────────────────────────────────────────────────── -->
<nav class="topnav">
    <a class="brand" href="/">
        <svg class="brand-icon" width="18" height="18" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="3" x2="12" y2="21"/>
            <line x1="8"  y1="21" x2="16" y2="21"/>
            <line x1="3"  y1="8"  x2="21" y2="8"/>
            <line x1="5"  y1="8"  x2="5"  y2="14"/>
            <line x1="19" y1="8"  x2="19" y2="14"/>
            <path d="M2 14a3 3 0 0 0 6 0H2z"/>
            <path d="M16 14a3 3 0 0 0 6 0h-6z"/>
        </svg>
        ПравоНавт
    </a>
    <div class="nav-sep"></div>
    <span class="nav-title">Граф онтологии</span>

    <div class="nav-right">

            <div class="stat-chip">

                <span id="cnt-term" class="stat-chip-val">0</span>
                <span>терм.</span>
            </div>
        </div>
        <a href="/" class="nav-link">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
                 stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
                <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            Главная
        </a>
    </div>
</nav>

<div class="main-area">
    <div id="loading">
        <div class="spinner"></div>
        <span class="loading-text">Загрузка графа...</span>
    </div>
    <div id="error-msg"></div>

    <svg id="graph-svg"></svg>

    <div class="controls">
        <button class="ctrl-btn" id="zoom-in"    title="Приблизить">+</button>
        <button class="ctrl-btn" id="zoom-out"   title="Отдалить">−</button>
        <button class="ctrl-btn" id="zoom-reset" title="По размеру">⊙</button>
    </div>

    <!-- ── SIDEBAR ─────────────────────────────────────────────────────── -->
    <div class="sidebar">
        <!-- node legend -->
        <div class="sb-section">
            <div class="sb-title">Типы узлов</div>
            <div class="legend-items">
                <div class="legend-item" data-type="law" title="Показать / скрыть">
                    <div class="legend-dot" style="background:var(--node-law)"></div>
                    <span class="legend-label">Закон</span>
                </div>
                <div class="legend-item" data-type="article" title="Показать / скрыть">
                    <div class="legend-dot" style="background:var(--node-article)"></div>
                    <span class="legend-label">Статья</span>
                </div>
                <div class="legend-item" data-type="term" title="Показать / скрыть">
                    <div class="legend-dot" style="background:var(--node-term)"></div>
                    <span class="legend-label">Термин</span>
                </div>
            </div>
        </div>

        <!-- edge legend -->
        <div class="sb-section">
            <div class="sb-title">Типы связей</div>
            <div class="edge-items">
                <div class="edge-item">
                    <svg width="24" height="10" viewBox="0 0 24 10">
                        <line x1="0" y1="5" x2="20" y2="5" stroke="#58a6ff" stroke-width="1.5" stroke-opacity=".7"/>
                        <polygon points="20,2 24,5 20,8" fill="#58a6ff" fill-opacity=".7"/>
                    </svg>
                    <span class="edge-label">Закон → Статья</span>
                </div>
                <div class="edge-item">
                    <svg width="24" height="10" viewBox="0 0 24 10">
                        <line x1="0" y1="5" x2="20" y2="5" stroke="#d29922" stroke-width="1.5" stroke-opacity=".7"/>
                        <polygon points="20,2 24,5 20,8" fill="#d29922" fill-opacity=".7"/>
                    </svg>
                    <span class="edge-label">Статья → Термин</span>
                </div>
                <div class="edge-item">
                    <svg width="24" height="10" viewBox="0 0 24 10">
                        <line x1="0" y1="5" x2="20" y2="5" stroke="#f85149" stroke-width="1.5"
                              stroke-opacity=".7" stroke-dasharray="4,2"/>
                        <polygon points="20,2 24,5 20,8" fill="#f85149" fill-opacity=".7"/>
                    </svg>
                    <span class="edge-label">Ссылка между актами</span>
                </div>
            </div>
        </div>

        <!-- filter -->
        <div class="sb-section">
            <div class="sb-title">Фильтр по закону</div>
            <select class="filter-select" id="filter-law">
                <option value="">Все законы</option>
            </select>
        </div>

        <!-- node detail -->
        <div class="node-detail empty" id="node-detail">
            <p>Кликните на узел<br>для просмотра деталей</p>
        </div>
    </div>
</div>

<div id="tooltip"></div>

<!-- stats-text hidden span kept for JS compatibility -->
<span id="stats-text" style="display:none"></span>

<script src="https://d3js.org/d3.v7.min.js"></script>
<script>
const COLOR = { law: '#58a6ff', article: '#3fb950', term: '#d29922' };
const EDGE_COLOR = { contains: '#58a6ff', uses: '#d29922', reference: '#f85149' };
const R = { law: 18, article: 10, term: 7 };

let allNodes = [], allEdges = [];
let hiddenTypes = new Set();
let filterLaw = '';
let simulation, svg, g, linkSel, nodeSel, zoom;

// ── Fetch data ──────────────────────────────────────────────────────────────
fetch('/api/graph')
    .then(r => r.json())
    .then(data => {
        if (data.error) throw new Error(data.error);
        allNodes = data.nodes;
        allEdges = data.edges;
        document.getElementById('loading').style.display = 'none';
        populateLawFilter();
        initGraph();
        updateStats();
    })
    .catch(err => {
        document.getElementById('loading').style.display = 'none';
        const el = document.getElementById('error-msg');
        el.style.display = 'flex';
        el.textContent = 'Ошибка загрузки графа: ' + err.message;
    });

// ── Law filter ──────────────────────────────────────────────────────────────
function populateLawFilter() {
    const sel = document.getElementById('filter-law');
    allNodes.filter(n => n.type === 'law').forEach(n => {
        const opt = document.createElement('option');
        opt.value = n.id;
        opt.textContent = n.label.length > 40 ? n.label.slice(0, 40) + '…' : n.label;
        sel.appendChild(opt);
    });
    sel.addEventListener('change', () => { filterLaw = sel.value; rebuildGraph(); });
}

// ── Compute visible nodes/edges ─────────────────────────────────────────────
function visibleData() {
    let nodes = allNodes.filter(n => !hiddenTypes.has(n.type));

    if (filterLaw) {
        const lawId = filterLaw;
        const directNodes = new Set();
        directNodes.add(lawId);
        allEdges.forEach(e => {
            if (e.source === lawId || (e.source && e.source.id === lawId)) directNodes.add(typeof e.target === 'object' ? e.target.id : e.target);
            if (e.target === lawId || (e.target && e.target.id === lawId)) directNodes.add(typeof e.source === 'object' ? e.source.id : e.source);
        });
        // also grab terms connected to those articles
        allEdges.forEach(e => {
            const s = typeof e.source === 'object' ? e.source.id : e.source;
            const t = typeof e.target === 'object' ? e.target.id : e.target;
            if (directNodes.has(s)) directNodes.add(t);
            if (directNodes.has(t)) directNodes.add(s);
        });
        nodes = nodes.filter(n => directNodes.has(n.id));
    }

    const nodeSet = new Set(nodes.map(n => n.id));
    const edges = allEdges.filter(e => {
        const s = typeof e.source === 'object' ? e.source.id : e.source;
        const t = typeof e.target === 'object' ? e.target.id : e.target;
        return nodeSet.has(s) && nodeSet.has(t) && !hiddenTypes.has('_edge');
    });

    return { nodes: nodes.map(n => ({ ...n })), edges: edges.map(e => ({ ...e })) };
}

function updateStats() {
    const laws    = allNodes.filter(n => n.type === 'law').length;
    const articles= allNodes.filter(n => n.type === 'article').length;
    const terms   = allNodes.filter(n => n.type === 'term').length;
    document.getElementById('stats-text').textContent =
        `Законов: ${laws} · Статей: ${articles} · Терминов: ${terms} · Связей: ${allEdges.length}`;
    document.getElementById('cnt-law').textContent  = laws;
    document.getElementById('cnt-art').textContent  = articles;
    document.getElementById('cnt-term').textContent = terms;
    document.getElementById('stats-chips').style.display = 'flex';
}

// ── D3 graph ────────────────────────────────────────────────────────────────
function initGraph() {
    const svgEl = document.getElementById('graph-svg');
    const W = svgEl.clientWidth, H = svgEl.clientHeight;

    svg = d3.select('#graph-svg');
    zoom = d3.zoom().scaleExtent([0.05, 4]).on('zoom', e => g.attr('transform', e.transform));
    svg.call(zoom);

    g = svg.append('g');

    // Arrow markers
    const defs = svg.append('defs');
    Object.entries(EDGE_COLOR).forEach(([type, color]) => {
        defs.append('marker')
            .attr('id', `arrow-${type}`)
            .attr('viewBox', '0 -4 8 8')
            .attr('refX', 14).attr('refY', 0)
            .attr('markerWidth', 6).attr('markerHeight', 6)
            .attr('orient', 'auto')
            .append('path')
            .attr('d', 'M0,-4L8,0L0,4')
            .attr('fill', color)
            .attr('opacity', 0.7);
    });

    g.append('g').attr('class', 'links');
    g.append('g').attr('class', 'nodes');

    simulation = d3.forceSimulation()
        .force('link', d3.forceLink().id(d => d.id).distance(d => {
            if (d.type === 'contains') return 80;
            if (d.type === 'uses') return 55;
            return 120;
        }).strength(0.6))
        .force('charge', d3.forceManyBody().strength(d => {
            if (d.type === 'law') return -600;
            if (d.type === 'article') return -120;
            return -40;
        }))
        .force('center', d3.forceCenter(W / 2, H / 2))
        .force('collision', d3.forceCollide().radius(d => R[d.type] + 4));

    rebuildGraph();

    // Fit on first load after simulation settles
    simulation.on('end.fit', () => { fitView(); simulation.on('end.fit', null); });

    // Zoom controls
    document.getElementById('zoom-in').onclick = () => svg.transition().call(zoom.scaleBy, 1.4);
    document.getElementById('zoom-out').onclick = () => svg.transition().call(zoom.scaleBy, 0.7);
    document.getElementById('zoom-reset').onclick = fitView;
}

function rebuildGraph() {
    const { nodes, edges } = visibleData();

    // Links
    linkSel = g.select('.links').selectAll('line').data(edges, d => d.source + '→' + d.target + d.type);
    linkSel.exit().remove();
    linkSel = linkSel.enter().append('line')
        .attr('stroke-opacity', 0.55)
        .attr('stroke-width', d => d.type === 'reference' ? 1.5 : 1)
        .attr('stroke-dasharray', d => d.type === 'reference' ? '5,3' : null)
        .attr('marker-end', d => `url(#arrow-${d.type})`)
        .merge(linkSel)
        .attr('stroke', d => EDGE_COLOR[d.type] || '#8b949e');

    // Nodes
    nodeSel = g.select('.nodes').selectAll('g.node').data(nodes, d => d.id);
    nodeSel.exit().remove();

    const enter = nodeSel.enter().append('g').attr('class', 'node')
        .style('cursor', 'pointer')
        .call(d3.drag()
            .on('start', dragStart)
            .on('drag', dragged)
            .on('end', dragEnd))
        .on('click', onNodeClick)
        .on('mouseenter', showTooltip)
        .on('mousemove', moveTooltip)
        .on('mouseleave', hideTooltip);

    enter.append('circle')
        .attr('r', d => R[d.type] || 8)
        .attr('fill', d => COLOR[d.type] || '#8b949e')
        .attr('stroke', '#0d1117')
        .attr('stroke-width', 1.5);

    enter.append('text')
        .attr('dy', d => (R[d.type] || 8) + 10)
        .attr('text-anchor', 'middle')
        .attr('fill', '#8b949e')
        .attr('font-size', d => d.type === 'law' ? 11 : 9)
        .attr('pointer-events', 'none')
        .text(d => d.label.length > 20 ? d.label.slice(0, 20) + '…' : d.label);

    nodeSel = enter.merge(nodeSel);

    simulation.nodes(nodes).on('tick', ticked);
    simulation.force('link').links(edges);
    simulation.alpha(0.4).restart();
}

function ticked() {
    linkSel
        .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
        .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
    nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
}

function fitView() {
    const svgEl = document.getElementById('graph-svg');
    const W = svgEl.clientWidth, H = svgEl.clientHeight;
    const bbox = g.node().getBBox();
    if (!bbox.width || !bbox.height) return;
    const scale = Math.min(0.9 * W / bbox.width, 0.9 * H / bbox.height, 2);
    const tx = W / 2 - scale * (bbox.x + bbox.width / 2);
    const ty = H / 2 - scale * (bbox.y + bbox.height / 2);
    svg.transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(scale));
}

// ── Drag ────────────────────────────────────────────────────────────────────
function dragStart(event, d) {
    if (!event.active) simulation.alphaTarget(0.3).restart();
    d.fx = d.x; d.fy = d.y;
}
function dragged(event, d) { d.fx = event.x; d.fy = event.y; }
function dragEnd(event, d) {
    if (!event.active) simulation.alphaTarget(0);
    d.fx = null; d.fy = null;
}

// ── Tooltip ─────────────────────────────────────────────────────────────────
const tooltip = document.getElementById('tooltip');
function showTooltip(event, d) {
    const typeLabel = { law: 'Закон', article: 'Статья', term: 'Термин' }[d.type] || d.type;
    tooltip.innerHTML = `<strong>${d.label}</strong><span>${typeLabel}</span>`;
    tooltip.style.display = 'block';
    moveTooltip(event);
}
function moveTooltip(event) {
    tooltip.style.left = (event.clientX + 12) + 'px';
    tooltip.style.top = (event.clientY - 28) + 'px';
}
function hideTooltip() { tooltip.style.display = 'none'; }

// ── Node detail panel ────────────────────────────────────────────────────────
function onNodeClick(event, d) {
    event.stopPropagation();
    const panel = document.getElementById('node-detail');
    const typeLabel = { law: 'Закон', article: 'Статья', term: 'Термин' }[d.type] || d.type;
    const badgeClass = `badge-${d.type}`;
    const dotColor = COLOR[d.type] || '#8b949e';

    // Count connections
    const { edges } = visibleData();
    const outgoing = edges.filter(e => (typeof e.source === 'object' ? e.source.id : e.source) === d.id).length;
    const incoming = edges.filter(e => (typeof e.target === 'object' ? e.target.id : e.target) === d.id).length;

    // Build link for law/article
    let linkHtml = '';
    if (d.type === 'law') {
        linkHtml = `<a class="detail-link" href="/" title="Открыть главную">↗ К списку документов</a>`;
    } else if (d.type === 'article' && d.law) {
        linkHtml = `<a class="detail-link" href="/" title="Найти статью">↗ Найти в поиске</a>`;
    }

    panel.className = 'node-detail';
    panel.innerHTML = `
        <div class="detail-badge ${badgeClass}">
            <div class="detail-badge-dot" style="background:${dotColor}"></div>
            ${typeLabel}
        </div>
        <div class="detail-label">${d.label}</div>
        <div class="detail-row"><span>Исходящих связей</span><span>${outgoing}</span></div>
        <div class="detail-row"><span>Входящих связей</span><span>${incoming}</span></div>
        ${linkHtml}
    `;

    // Highlight node
    g.select('.nodes').selectAll('circle')
        .attr('stroke', n => n.id === d.id ? '#fff' : '#0d1117')
        .attr('stroke-width', n => n.id === d.id ? 2.5 : 1.5);
}

svg && svg.on('click', () => {
    document.getElementById('node-detail').className = 'node-detail empty';
    document.getElementById('node-detail').innerHTML = '<p>Кликните на узел<br>для просмотра деталей</p>';
    g && g.select('.nodes').selectAll('circle')
        .attr('stroke', '#0d1117').attr('stroke-width', 1.5);
});

// ── Legend toggle ─────────────────────────────────────────────────────────────
document.querySelectorAll('.legend-item[data-type]').forEach(item => {
    item.addEventListener('click', () => {
        const type = item.dataset.type;
        if (hiddenTypes.has(type)) {
            hiddenTypes.delete(type);
            item.classList.remove('hidden');
        } else {
            hiddenTypes.add(type);
            item.classList.add('hidden');
        }
        rebuildGraph();
    });
});
</script>
</body>
</html>
